<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday!</title>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Caveat:wght@500;700&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--felt:#ffd9e6;--felt2:#fff0f6;--paper:#fffdf7;--ink:#3b2038;--tape:#ffe08a;--pink:#ff8fb1;--mint:#a8ead6;--rose:#c2386f;--lav:#e3d6ff;--light:#4a2441}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--felt) radial-gradient(rgba(255,255,255,.75) 1.5px,transparent 1.5px) 0 0/18px 18px;color:var(--light);font-family:'DM Sans',system-ui,sans-serif;line-height:1.5;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tape);outline-offset:3px}
h1,h2,h3{font-family:'Bagel Fat One','Arial Rounded MT Bold',system-ui,sans-serif;font-weight:400;margin:0;line-height:1.1}
h1{font-size:clamp(2.6rem,10vw,5rem);text-shadow:4px 4px 0 #fff;text-align:center}
h2{font-size:clamp(1.6rem,5vw,2.2rem);text-align:center;margin-bottom:.5rem}
h3{font-size:1.4rem;margin-bottom:.6rem}
.hand{font-family:'Caveat','Comic Sans MS',cursive}
.xl{font-size:clamp(1.6rem,5vw,2.4rem);text-align:center;margin:.4rem 0}
.sub{color:var(--rose);font-size:1.3rem;margin:.1rem 0 .7rem;text-align:center}
#stage{flex:1;position:relative;min-height:0;isolation:isolate}
.page{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:64px 1rem;overflow-y:auto;overflow-x:hidden}
.page.on{display:flex}
.page::before{content:"";margin-top:auto}.page::after{content:"";margin-bottom:auto}
.page.wallp::before,.page.wallp::after{display:none}
.page.wallp{padding:60px .6rem .4rem;overflow:hidden}.page.wallp>*{margin:0}
.fw{animation:fw .45s ease}.bk{animation:bk .45s ease}
@keyframes fw{from{opacity:0;transform:translateX(40px)}}
@keyframes bk{from{opacity:0;transform:translateX(-40px)}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.badge{display:inline-block;margin:1rem 0;background:var(--tape);color:var(--ink);font-family:'Bagel Fat One',sans-serif;font-size:1.4rem;padding:.2rem 1rem;border-radius:999px;transform:rotate(-3deg)}
.cta{border:0;cursor:pointer;background:var(--tape);color:var(--ink);font-weight:700;padding:.8rem 1.8rem;border-radius:999px;margin-top:.8rem;min-height:44px}
#gift{all:unset;cursor:pointer;font-size:7rem;line-height:1;animation:wob 2.2s ease-in-out infinite}
#gift:focus-visible{outline:3px solid var(--tape);border-radius:20px}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.06)}}
.note{background:#fff3a8;color:var(--ink);max-width:560px;width:100%;padding:1.5rem 1.4rem;font-size:1.5rem;line-height:1.3;transform:rotate(-1.5deg);box-shadow:4px 6px 0 rgba(0,0,0,.25);position:relative}
.note p{margin:0 0 .6rem}
.note::before{content:"";position:absolute;top:-12px;left:50%;width:90px;height:24px;background:rgba(255,122,162,.85);transform:translateX(-50%) rotate(3deg)}
.cnt{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;font-size:.9rem;font-weight:700}
.cnt span{background:var(--felt2);padding:.2rem .8rem;border-radius:999px}
.wall{flex:1;width:100%;position:relative;min-height:260px;touch-action:none}
.pol{position:absolute;background:var(--paper);padding:5px 5px 2px;box-shadow:2px 5px 12px rgba(0,0,0,.4);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--ink)}
.tp{position:absolute;top:-7px;left:50%;width:40px;height:14px;background:rgba(255,209,102,.9);transform:translateX(-50%) rotate(-4deg)}
.ph{position:relative;display:grid;place-items:center;font-size:2.6rem;overflow:hidden;width:100%;aspect-ratio:1}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-user-drag:none}
.pol .cap{font-size:clamp(.9rem,3vw,1.2rem);text-align:center;line-height:1.1;padding:.2rem 0;min-height:1.7em}
.pol video{width:100%;aspect-ratio:4/3;object-fit:cover;background:#000;display:block}
.yn{display:flex;gap:1rem;justify-content:center;align-items:center;margin-top:.8rem}
.yn .cta{margin:0}
.cta.no{background:#fff;color:var(--ink)}
.no.fx{position:fixed;z-index:20;transition:left .22s ease,top .22s ease}
.stk{all:unset;position:absolute;cursor:pointer;font-size:1.7rem;z-index:5000;filter:drop-shadow(1px 2px 1px rgba(0,0,0,.4))}
.stk:hover{transform:scale(1.25)}.stk.found{opacity:.3;pointer-events:none}
#lb{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.75);display:grid;place-items:center;align-content:center;gap:.8rem}
#lbx{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;width:44px;height:44px;border-radius:50%;border:0;background:var(--tape);color:var(--ink);font-size:1.2rem;cursor:pointer}
.pl{width:min(86vw,340px,calc(58vh*.8));aspect-ratio:1/1.25;perspective:900px;cursor:pointer}
.in2{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.pl.fl .in2{transform:rotateY(180deg)}
.fc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);color:var(--ink);padding:12px 12px 6px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;flex-direction:column}
.fc .ph{flex:none}
.fc .cap{flex:1;display:grid;place-items:center;font-size:1.7rem;text-align:center;line-height:1.1}
.fc.b2{transform:rotateY(180deg);background:#fffbe8;justify-content:center;text-align:center;padding:1.2rem;overflow:auto}
.fc.b2 p{font-size:1.5rem;line-height:1.25;margin:0}
.tip{color:#fff;margin:0;font-size:1.3rem}
.tl{width:100%;max-width:760px;display:grid;gap:1.8rem}
.ev{display:grid;gap:.6rem;align-items:center}
.evp{background:var(--paper);padding:6px;box-shadow:3px 5px 12px rgba(0,0,0,.35);transform:rotate(-2deg);width:100%;max-width:280px;margin:auto;color:var(--ink)}
.evp .ph{aspect-ratio:4/3}
.ev:nth-child(even) .evp{transform:rotate(2deg)}
.evt b{font-size:1.7rem;color:var(--rose)}.evt p{margin:.1rem 0 0}
@media(min-width:700px){.ev{grid-template-columns:1fr 1fr;gap:2rem}.ev:nth-child(even) .evp{order:2}}
.chat{width:100%;max-width:520px;display:flex;flex-direction:column;gap:.6rem}
.b{max-width:82%;padding:.6rem .95rem;border-radius:18px;opacity:0}
.on .b{animation:pop .4s forwards}
.b.you{background:#fff;color:var(--ink);align-self:flex-start;border-bottom-left-radius:4px}
.b.me{background:#ffb3cc;color:var(--ink);align-self:flex-end;border-bottom-right-radius:4px}
.card{background:var(--felt2);border-radius:20px;padding:1.2rem;width:100%;max-width:520px}
.opt{display:block;width:100%;margin:.5rem 0;padding:.8rem 1rem;border-radius:14px;border:2px solid #f3a9c4;background:#fff;font:inherit;cursor:pointer;text-align:left}
.opt.ok{background:#bff0d4;border-color:#6fcf9b}.opt.no{background:#ffc2cf;border-color:#ee7f9a}
.rs{width:100%;max-width:520px;display:grid;gap:.6rem;margin:.6rem 0}
.rc{background:var(--paper);color:var(--ink);padding:.9rem 1.1rem;border-radius:16px;border-left:8px solid #7ee0c8;animation:pop .4s}
.lock{all:unset;cursor:pointer;width:min(70vw,260px);aspect-ratio:1/1.2;background:var(--paper);color:var(--ink);padding:10px;box-shadow:3px 6px 14px rgba(0,0,0,.4);transform:rotate(2deg);display:block}
.lock:focus-visible{outline:3px solid var(--tape)}
.lock span{height:100%;display:grid;place-items:center;align-content:center;text-align:center;font-size:3.4rem;background:repeating-linear-gradient(45deg,#e7e2d3,#e7e2d3 10px,#f3efe2 10px,#f3efe2 20px)}
.lock small{font-size:1.4rem;line-height:1.1}
.gal{position:relative;width:100%;max-width:760px;margin-bottom:1.2rem}
.gal figure{position:absolute;margin:0;background:var(--paper);color:var(--ink);padding:6px;box-shadow:2px 5px 12px rgba(120,40,80,.3)}
.gal figure[data-v="0"]{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.gal video,.gal .ph{width:100%;aspect-ratio:4/3;object-fit:cover;background:#000;display:block}
.gal figcaption{text-align:center;font-size:1.2rem}
.candles{display:flex;justify-content:center;gap:1.2rem;height:70px;align-items:flex-end}
.candle{all:unset;cursor:pointer;width:14px;height:44px;background:repeating-linear-gradient(#8ecbff 0 8px,#fff 8px 16px);position:relative;border-radius:3px}
.candle::before{content:"";position:absolute;left:50%;top:-22px;width:14px;height:22px;background:radial-gradient(circle at 50% 70%,#fff3a8,#ff9f1c 60%,transparent 70%);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;transform:translateX(-50%);animation:fl .5s infinite alternate}
.candle:focus-visible{outline:3px solid var(--tape);outline-offset:14px}
.candle.out::before{display:none}
@keyframes fl{to{transform:translateX(-50%) scale(1.15,.9)}}
.t1,.t2{margin:0 auto}.t1{width:190px;height:52px;background:var(--pink);border-radius:12px 12px 0 0;box-shadow:inset 0 12px 0 #fff}
.t2{width:250px;height:68px;background:#cdb4ff;border-radius:0 0 16px 16px;box-shadow:inset 0 12px 0 #fff}
.wm{font-size:1.9rem;color:var(--rose);min-height:3rem;text-align:center;margin:.8rem 0 0}
#nav{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:0;right:0;z-index:90;display:flex;align-items:center;justify-content:space-between;padding:0 .8rem;pointer-events:none}
#nav .nb{pointer-events:auto}
.nb{border:0;border-radius:50%;width:48px;height:48px;padding:0;font-size:1.6rem;line-height:1;background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 2px 8px rgba(120,40,80,.2)}
.nb:disabled{opacity:.3;cursor:default}.nb.pri{background:var(--pink);color:#fff}
#mu{box-shadow:0 2px 8px rgba(120,40,80,.2);position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:95;width:40px;height:40px;border-radius:50%;border:0;background:var(--felt2);cursor:pointer}
#toast{position:fixed;left:50%;bottom:80px;box-shadow:0 4px 14px rgba(120,40,80,.25);transform:translate(-50%,160px);background:var(--tape);color:var(--ink);padding:.6rem 1.1rem;border-radius:16px;font-size:1.4rem;max-width:90vw;text-align:center;transition:transform .4s;z-index:120}
#toast.on{transform:translate(-50%,0)}
#cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:150}
.spark{position:fixed;pointer-events:none;z-index:140;font-size:16px;animation:sp .8s forwards}
@keyframes sp{to{opacity:0;transform:translateY(-24px) scale(.4)}}
@media (max-height:480px){.page{padding-top:54px;padding-bottom:54px}.page.wallp{padding-top:50px}.nb{width:40px;height:40px;font-size:1.3rem}#mu{width:34px;height:34px}}
@media (prefers-reduced-motion: reduce){#gift,.candle::before,.fw,.bk{animation:none}.in2{transition:none}}
</style>
</head>
<body>
<canvas id="cv" aria-hidden="true"></canvas>
<div id="toast" role="status"></div>
<button id="mu" hidden aria-label="Toggle music">🎵</button>
<div id="stage"></div>
<nav id="nav" hidden>
  <button class="nb" id="bk" aria-label="Previous page">←</button>
  <button class="nb pri" id="nx" aria-label="Next page">→</button>
</nav>
<div id="lb" hidden><div id="lbw"></div><button id="lbx" aria-label="Close">✕</button></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
